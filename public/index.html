<p id="unsupported" class="quiet pad" hidden>GhostShell needs a newer browser: Safari 16.4, Chrome 89 or Firefox 108 or later.</p>
<script>if (!(window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports('importmap'))) { document.getElementById('unsupported').hidden = false; document.getElementById('boot').hidden = true }</script>
<div class="app" id="boot" data-view="list">
  <nav class="rail" aria-label="Projects" hidden><div class="rail-head"><h2 class="rail-title">Projects</h2></div></nav>
  <nav class="list" aria-label="Sessions">
    <header class="list-head">
      <button class="btn projects-toggle" data-variant="ghost" data-size="icon-sm" type="button" aria-label="Projects" aria-expanded="false" disabled><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="2.75" y="3.75" width="14.5" height="12.5" rx="2.25" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7.75 4v12" stroke="currentColor" stroke-width="1.6"/></svg></button>
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><h1>GhostShell</h1></div>
      <div class="list-actions">
        <button class="btn add" data-variant="ghost" data-size="icon-sm" type="button" aria-label="New session or group" disabled><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <button class="btn find" data-variant="ghost" data-size="icon-sm" type="button" aria-label="Find a session" disabled><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12.6 12.6 17 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      </div>
    </header>
    <div class="sections"><p class="quiet pad">Loading sessions</p></div>
    <footer class="list-foot">
      <div class="foot-links">
        <a class="btn" data-variant="ghost" data-size="sm" href="#/routines">Routines</a>
        <a class="btn" data-variant="ghost" data-size="sm" href="#/passkeys">Passkeys</a>
      </div>
      <form method="post" action="logout"><button class="btn" data-variant="ghost" data-size="sm" type="submit">Sign out</button></form>
    </footer>
  </nav>
  <main class="chat"><section class="empty"><div class="emblem" aria-hidden="true"></div><p>Pick a session, or start a new one.</p></section></main>
</div>
