name: Swift app

# The Swift builds, tests and most Mac screenshots run here, so a Swift change needs less of the owner's Mac.
# See https://github.com/kulesy/ghostshell/issues/138.
on:
  push:
    paths:
      - 'apple/**'
      - 'test/speakers.mjs'
      - 'package.json'
      - '.github/workflows/swift.yml'
  # Same-repo branches already run on push, so a pull request only runs for a fork (see `if` on each job).
  pull_request:
    paths:
      - 'apple/**'
      - 'test/speakers.mjs'
      - 'package.json'
      - '.github/workflows/swift.yml'
  workflow_dispatch:
    inputs:
      iphone:
        description: Also run the iPhone UI tests, which still have flaky tests on iOS 27
        type: boolean
        default: false
      tests:
        description: Run only these iPhone UI tests (comma list of test names), to rerun a failure quickly. Empty runs them all.
        type: string
        default: ''
      flows:
        description: Also try these Mac flows (comma list, such as files,accounts) in a step that may fail, to get their screenshots from a runner that fails their checks.
        type: string
        default: ''

# NOTE: [11 Nov 2026] EK - The repo is public and forks run this, so the token stays read-only and no step reads a secret.
permissions:
  contents: read

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
  # Same pin as node.yml. page-shots.mjs and parity.mjs find the headless shell this installs in Playwright's cache (test/browser.mjs).
  PLAYWRIGHT_VERSION: 1.65.0

jobs:
  build-and-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false
      - run: npm run apple:test
      - run: npm run apple:build -- --release
      - run: npm run apple:ios-build -- --release
      - run: npm run apple:watch-build -- --release

  mac-shots:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false
      # --no-chat: the real Haiku chat needs a signed-in claude, which a runner never has.
      # NOTE: [18 Nov 2026] EK - The runner's macOS 27.0.1 crashes SwiftUI in the groups flow,
      # and marks and organise fail checks there, so those run on a Mac until the image reaches 27.2. See apple/README.md.
      - run: npm run apple:shot -- --no-chat --flow main,widgets,approvals,routines,files,accounts --out "$RUNNER_TEMP/shots/mac"
      - if: always() && inputs.flows != ''
        continue-on-error: true
        env:
          FLOWS: ${{ inputs.flows }}
        run: npm run apple:shot -- --no-chat --flow "$FLOWS" --out "$RUNNER_TEMP/shots/mac"
      # The chat screens, the composer and the terminal, in their own step so a failure above does not skip them.
      - if: success() || failure()
        run: npm run apple:shot -- --no-chat --flow chats,composer,terminal --out "$RUNNER_TEMP/shots/mac"
      # The journeys, in light only. A step that fails is recorded in journeys-mac.json and does not fail this step.
      - if: success() || failure()
        run: npm run apple:shot -- --no-chat --only light --flow journeys --out "$RUNNER_TEMP/shots/mac"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mac-screenshots
          path: ${{ runner.temp }}/shots/mac
          retention-days: 14

  # The web page at the Mac window sizes, each shot paired with the Mac shot of the same screen. See apple/README.md.
  parity:
    needs: mac-shots
    if: needs.mac-shots.result == 'success'
    # The same runner as mac-shots, so the fonts match.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-screenshots
          path: ${{ runner.temp }}/shots/mac
      # playwright-core goes in a folder under RUNNER_TEMP, not into the repo.
      - run: npm install --prefix "$RUNNER_TEMP/playwright" --no-save --no-audit --no-fund "playwright-core@$PLAYWRIGHT_VERSION"
      - run: npx --yes "playwright@$PLAYWRIGHT_VERSION" install chromium-headless-shell
      # A failed screen still fails the job, but the other width and the pairs still run.
      - run: |
          status=0
          for width in 960 640; do
            node apple/scripts/page-shots.mjs --set all --size "$width" --out "$RUNNER_TEMP/shots/web" || status=1
          done
          exit $status
        env:
          PLAYWRIGHT_CORE: ${{ runner.temp }}/playwright/node_modules/playwright-core
      # The same journeys as the Mac, into the same folder. A failed step is recorded in journeys-web.json and does not fail this step.
      - if: always()
        run: node apple/scripts/page-shots.mjs --journeys --size 960 --scheme light --out "$RUNNER_TEMP/shots/web"
        env:
          PLAYWRIGHT_CORE: ${{ runner.temp }}/playwright/node_modules/playwright-core
      - if: always()
        run: node apple/scripts/parity.mjs --mac "$RUNNER_TEMP/shots/mac" --page "$RUNNER_TEMP/shots/web" --out "$RUNNER_TEMP/shots/pairs"
        env:
          PLAYWRIGHT_CORE: ${{ runner.temp }}/playwright/node_modules/playwright-core
      - if: always()
        run: awk '/^## /{p=($0=="## Journeys")} p' "$RUNNER_TEMP/shots/pairs/pairs.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: parity-pairs
          path: ${{ runner.temp }}/shots/pairs
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: web-screenshots
          path: ${{ runner.temp }}/shots/web
          retention-days: 14

  # One job per device and appearance, because the four passes take about two hours in a row.
  # NOTE: [13 Nov 2026] EK - Runs only by hand until the flaky iOS 27 tests are fixed, so other branches' runs stay green. See apple/README.md.
  iphone-shots:
    if: inputs.iphone
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        device: [se, 16pro]
        appearance: [light, dark]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false
      # The tests input goes through the environment, never into the script text.
      - run: npm run apple:ios-shot -- --device ${{ matrix.device }} --only ${{ matrix.appearance }} ${TESTS:+--test "$TESTS"} --out "$RUNNER_TEMP/shots/iphone"
        env:
          GS_IOS_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-27-2
          TESTS: ${{ inputs.tests }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: iphone-screenshots-${{ matrix.device }}-${{ matrix.appearance }}
          path: ${{ runner.temp }}/shots/iphone
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || cancelled()
        with:
          name: iphone-test-logs-${{ matrix.device }}-${{ matrix.appearance }}
          path: apple/build/ios/last-*.log
          retention-days: 14
